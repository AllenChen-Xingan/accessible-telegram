[package]
name = "atg-gui-spec"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false
description = "无障碍 Telegram 界面的表（稳定标识、无障碍树契约、文案）与纯函数投影；不依赖 GPUI，CI 不编界面也能测"

[dependencies]
atg-core = { path = "../atg-core" }
serde_json = { version = "1", features = ["preserve_order"] }

[dev-dependencies]
insta = "1"

[[bin]]
name = "gui-schema"
path = "src/bin/gui-schema.rs"
