[package]
name = "atg-core"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false
description = "无障碍 Telegram 的能力层：内容树、读法（原型阶段不接 TDLib）"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

[dev-dependencies]
insta = "1"
