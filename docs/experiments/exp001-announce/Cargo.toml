[package]
name = "exp001-announce"
version = "0.0.0"
edition = "2024"
publish = false

# 空 workspace 表：不让根目录的 workspace 吞掉本实验
[workspace]

[dependencies]
# Zed 浅克隆 commit 79fe6a6，与调研时一致
gpui = { path = "../../../resources/zed/crates/gpui" }
gpui_platform = { path = "../../../resources/zed/crates/gpui_platform", features = ["font-kit"] }
objc2 = "0.6"
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSString", "NSDictionary", "NSValue", "NSArray"] }
serde_json = "1"
libc = "0.2"
log = "0.4"
env_logger = "0.11"

# 照搬 Zed 根 Cargo.toml 里 gpui 依赖树会用到的那条补丁（async-task 用 Zed 的分支）
[patch.crates-io]
async-task = { git = "https://github.com/zed-industries/async-task.git", rev = "015845a19fc31752c02367567d3b8900a406f9da" }
calloop = { git = "https://github.com/zed-industries/calloop", rev = "3759371fee14c40066d64777e2a36b6ffcc22590" }
